<script>
async function createProject(){const category=$('newCategory').value,name=$('newProjectName').value.trim();if(!name){alert('Enter the project name.');return}try{const result=await call('createProjectFolder',category,name);lastProject=result;mediaDestination=result.id;await refresh();toast(result.existing?'Existing project selected':'Project folder created. Select Create upload folder next.')}catch(e){alert(e.message||e)}}
async function createBatch(){const destination=mediaDestination==='intake'?data.intakeId:mediaDestination;const note=$('batchNote').value;try{lastBatch=await call('createUploadBatch',destination,note);lastReport=null;await refresh();toast('Upload folder ready in '+lastBatch.destination)}catch(e){alert(e.message||e)}}
function prettyBytes(n){if(n<1024)return n+' bytes';if(n<1048576)return (n/1024).toFixed(0)+' KB';return (n/1048576).toFixed(1)+' MB'}
function previewMediaSelection(files,append=false){const list=[...(files||[])];selectedMedia=append?[...selectedMedia,...list]:list;$('mediaSelection').innerHTML=selectedMedia.length?'<b>'+selectedMedia.length+' selected</b><br>'+selectedMedia.map(f=>esc(f.name)+' · '+prettyBytes(f.size)+' · '+esc(f.type||'file type not supplied')+(f.lastModified?' · '+esc(new Date(f.lastModified).toLocaleString()):'')).join('<br>'):'Choose originals or take a new photo to see filenames, sizes, and file dates here.'}
async function sha256(file){const bytes=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());return [...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function mediaUploadForm(batchId,file,hash){const form=document.createElement('form');form.style.display='none';const add=(name,value)=>{const input=document.createElement('input');input.type='hidden';input.name=name;input.value=String(value??'');form.appendChild(input)};add('batchId',batchId);add('originalName',file.name);add('mediaType',file.type||'');add('byteSize',file.size);add('deviceModified',file.lastModified||0);add('sha256',hash);const input=document.createElement('input');input.type='file';input.name='mediaFile';const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;form.appendChild(input);document.body.appendChild(form);return form}
async function uploadMediaFiles(){const input=$('mediaFiles'),camera=$('cameraCapture'),files=[...selectedMedia],button=$('uploadMediaButton'),feedback=$('uploadFeedback');if(!lastBatch||!files.length){alert('Create an upload folder and select or take one or more originals.');return}const tooLarge=files.filter(f=>f.size>45*1024*1024);if(!confirm('Upload '+files.length+' original file(s) to '+lastBatch.destination+'?'+(tooLarge.length?' '+tooLarge.length+' file(s) over 45 MB will need Drive’s uploader.':'')))return;button.disabled=true;const uploaded=[],duplicates=[],failed=[],retryFiles=[];try{for(let i=0;i<files.length;i++){const file=files[i];if(file.size>45*1024*1024){failed.push(file.name+' is over 45 MB. Use the Drive folder link above.');continue}feedback.innerHTML='<div class="notice">Checking and uploading '+(i+1)+' of '+files.length+': '+esc(file.name)+'</div>';let form;try{const hash=await sha256(file);form=mediaUploadForm(lastBatch.id,file,hash);const result=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadMediaFile(form));if(result.duplicate)duplicates.push(file.name);else uploaded.push(file.name)}catch(e){failed.push(file.name+': '+(e.message||e));retryFiles.push(file)}finally{form?.remove()}}lastReport=await call('getBatchStatus',lastBatch.id);feedback.innerHTML='<div class="notice"><b>'+(failed.length?'Upload finished with files to review.':'Batch complete.')+'</b> Uploaded '+uploaded.length+' file(s); skipped '+duplicates.length+' exact duplicate(s). '+lastReport.count+' total file(s), '+(lastReport.bytes/1048576).toFixed(1)+' MB, filed under '+esc(lastReport.destination)+'.'+(failed.length?'<br>'+failed.map(esc).join('<br>'):'')+'</div>';input.value='';camera.value='';previewMediaSelection(retryFiles)}catch(e){feedback.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}finally{if($('uploadMediaButton'))$('uploadMediaButton').disabled=false}}
async function inspectBatch(id){try{lastReport=await call('getBatchStatus',id);render()}catch(e){alert(e.message||e)}}
async function fileIntake(id){const target=$('target-'+id).value;if(!target){alert('Choose the project first.');return}const batch=data.intakeBatches.find(b=>b.id===id),project=data.projects.find(p=>p.id===target);if(!confirm(`Move ${batch.name} into ${project.name}?`))return;try{const moved=await call('moveIntakeBatch',id,target);await refresh();toast('Batch filed in '+moved.destination)}catch(e){alert(e.message||e)}}
function openNew(){modalOpener=document.activeElement;modal='form';method='manual';draft=blank();fileData=null;companyEdited=false;renderModal()}
function openDetails(id){modalOpener=document.activeElement;modal='details';draft=data.contacts.find(c=>c.id===id);renderModal()}
function closeModal(){modal=null;pending=null;$('overlay').innerHTML='';document.querySelector('.top').inert=false;$('app').inert=false;if(modalOpener?.isConnected)modalOpener.focus();modalOpener=null}
function openEdit(){modal='form';method='manual';draft=JSON.parse(JSON.stringify(draft));fileData=null;companyEdited=false;renderModal()}

</script>
