<style>
:root {
  --basalt:#26352F; --lichen:#738273; --sandstone:#D8C8B5; --terracotta:#B66A4E; --chalk:#F5F2E9;
    --surface:#fff; --surface-soft:#EAE4DA; --text:#26352F; --ink-soft:#58645B;
      --clay-text:#91472F; --clay-action:#985138; --on-action:#F5F2E9; --action-hover:#7E3F29;
        --line:rgba(38,53,47,.22); --control-line:#738273; --focus:#91472F;
          --error:#A33027; --error-surface:#FCEBE5; --success-surface:#E8EEE8; --success-line:#C7D5C9;
            color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-synthesis:none;
            }
            * { box-sizing:border-box; }
            html { scroll-padding-top:110px; }
            body { margin:0; background:var(--chalk); color:var(--text); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }

            .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:13px max(18px,calc((100vw - 1180px)/2)); background:var(--basalt); color:var(--chalk); box-shadow:0 5px 20px rgba(38,53,47,.12); }

            .workspace-head { display:flex; align-items:center; justify-content:flex-end; gap:22px; }
