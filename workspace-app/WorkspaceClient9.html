<script>
async function submitContact(mergeInto='',keepSeparate=false){collectDraft();const feedback=$('formFeedback'),button=$('saveButton');feedback.innerHTML='';if(!draft.name.trim()){feedback.innerHTML='<div class="error">Enter a name.</div>';return}if(!draft.role){feedback.innerHTML='<div class="error">Choose Client, Vendor, or Both.</div>';document.querySelector('input[name="role"]')?.focus();return}if(!draft.id&&method!=='manual'&&!fileData){feedback.innerHTML='<div class="error">Choose the source file first.</div>';return}button.disabled=true;try{const payload={id:draft.id||'',draft,kind:method,file:fileData,mergeInto,keepSeparate,updateCompanyProjects:companyEdited,submissionKey:pending?.submissionKey||contactSubmissionKey||newWorkspaceRequestId()};const result=await call('saveContact',payload);if(result.possibleMatches){pending=payload;feedback.innerHTML='<div class="error">Possible duplicate by email or phone. Review before saving.</div>'+result.possibleMatches.map(m=>'<button class="small-button" style="margin:4px" onclick="submitContact(\''+esc(m.id)+'\',false)">Add to '+esc(m.name)+'</button>').join('')+'<button class="small-button" style="margin:4px" onclick="submitContact(\'\',true)">Keep separate</button>';button.disabled=false;return}contactSubmissionKey='';closeModal();await refresh();toast('Contact saved'+(result.notification==='Sent'?'. Email alert sent.':'. Email alert queued for retry.'));}catch(e){feedback.innerHTML='<div class="error">'+esc(e.message||e)+'</div>';button.disabled=false}}

</script>
