<script>
function renderModal(){if(!modal){$('overlay').innerHTML='';return}if(modal==='details'){const c=draft;$('overlay').innerHTML='<div class="modalwrap" onclick="closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()"><div class="modalhead"><div class="eyebrow">CONTACT DETAILS</div><button class="x" aria-label="Close contact dialog" onclick="closeModal()">×</button></div><h2 id="modalTitle">'+esc(c.name)+'</h2><span class="tag '+esc(c.role)+'">'+roles(c)+'</span><p>'+esc([c.company,c.email,c.phone].filter(Boolean).join(' · '))+'</p>'+(c.note?'<p>'+esc(c.note).replace(/\n/g,'<br>')+'</p>':'')+'<p><b>Projects for this person:</b> '+esc(data.projects.filter(p=>c.projectIds.includes(p.id)).map(p=>p.name).join(', ')||'None')+'</p>'+(c.company?'<p><b>Projects for the whole company:</b> '+esc(data.projects.filter(p=>c.companyProjectIds.includes(p.id)).map(p=>p.name).join(', ')||'None')+'</p>':'')+'<div class="sources"><b>Source history</b>'+(c.sources.length?c.sources.map(s=>'<a target="_blank" href="'+esc(s.url||data.hubUrl)+'">'+esc(s.kind.replace(/_/g,' '))+' · '+esc(s.filename||s.context||s.created)+' ↗</a>').join(''):'<p>No sources recorded.</p>')+'</div><div class="modalfooter"><button class="small-button" onclick="closeModal()">Close</button><button class="primary" onclick="openEdit()">Edit contact</button></div></section></div>';activateModal();return}
const editing=Boolean(draft.id),projectBoxes=(key)=>data.projects.map(p=>'<label><input type="checkbox" name="'+key+'" value="'+esc(p.id)+'" '+((draft[key]||[]).includes(p.id)?'checked':'')+' '+(key==='companyProjectIds'&&!companyKey(draft.company)?'disabled':'')+' onchange="'+(key==='companyProjectIds'?'companyEdited=true;updateCompanyProjectSummary()':'')+'"> '+esc(p.name)+'</label>').join('')||'<span class="muted">No project folders yet.</span>';
$('overlay').innerHTML='<div class="modalwrap" onclick="closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()"><div class="modalhead"><div class="eyebrow">'+(editing?'EDIT CONTACT':'NEW CONTACT')+'</div><button class="x" aria-label="Close contact dialog" onclick="closeModal()">×</button></div><h2 id="modalTitle">'+ (editing?'Edit contact':'Add a contact')+'</h2><p class="muted">Check the details and choose Client, Vendor, or Both before saving.</p>'+(editing?'':'<div class="methods">'+[['manual','Manual'],['vcard','Contact card'],['business_card','Business card photo']].map(([id,label])=>'<button class="'+(method===id?'on':'')+'" onclick="switchMethod(\''+id+'\')">'+label+'</button>').join('')+'</div>')+(editing||method==='manual'?'':method==='vcard'?'<div class="filebox"><b>Choose a .vcf contact card</b><input type="file" id="sourceFile" accept=".vcf,text/vcard" onchange="chooseSourceFromInput(this)"><small class="muted">Available fields will be filled below. Review them before saving.</small><div id="filePreview"></div></div>':'<div class="filebox"><b>Choose how to add a business card photo</b><div class="methods source-choices" role="group" aria-label="Choose a business card photo source"><button type="button" class="small-button" id="cameraChoice" data-source="Camera" onclick="openCardSource(this.dataset.source)">Use camera</button><button type="button" class="small-button" id="photosChoice" data-source="Photos" onclick="openCardSource(this.dataset.source)">Choose from photos</button><button type="button" class="small-button" id="filesChoice" data-source="Files" onclick="openCardSource(this.dataset.source)">Browse files</button></div><input hidden type="file" id="sourceCamera" accept="image/*" capture="environment" onchange="chooseSourceFromInput(this)"><input hidden type="file" id="sourcePhotos" accept="image/*" onchange="chooseSourceFromInput(this)"><input hidden type="file" id="sourceFiles" accept="image/*" onchange="chooseSourceFromInput(this)"><small id="sourceHelp" class="muted">The original photo stays attached so you can review it before saving.</small><div id="filePreview"></div></div>')+'<div class="grid"><label>Full name *<input id="name" value="'+esc(draft.name)+'"></label><label>Company<input id="company" value="'+esc(draft.company)+'" onblur="loadCompanyLinks()"></label><label>Phone<input id="phone" type="tel" value="'+esc(draft.phone)+'"></label><label>Email<input id="email" type="email" value="'+esc(draft.email)+'"></label></div><div class="sectionlabel">RELATIONSHIP</div><div class="role">'+[['client','Client'],['vendor','Vendor'],['both','Both']].map(([id,label])=>'<label><input type="radio" name="role" value="'+id+'" '+(draft.role===id?'checked':'')+'> '+label+'</label>').join('')+'</div><div class="sectionlabel">PROJECTS THIS PERSON WORKS ON</div><p class="muted">Optional. These links are saved only to this person’s contact.</p><div class="checks">'+projectBoxes('projectIds')+'</div><details class="company-links"><summary id="companyProjectSummary">Projects for the whole company (optional)</summary><div class="company-copy"><p id="companyProjectHelp" class="muted">These links are shared across everyone listed under this company and help the CRM connect company contacts and records to its projects. Saving changes here replaces the shared list for all contacts at this company.</p><div class="checks">'+projectBoxes('companyProjectIds')+'</div></div></details><label class="wide">Optional note<textarea id="note">'+esc(draft.note)+'</textarea></label><div id="formFeedback" class="feedback" role="status" aria-live="polite"></div><div class="modalfooter"><button class="small-button" onclick="closeModal()">Cancel</button><button id="saveButton" class="primary" onclick="submitContact()">Save contact</button></div></section></div>';activateModal();updateCompanyProjectSummary();
}
function activateModal(){document.querySelector('.top').inert=true;$('app').inert=true;const panel=document.querySelector('#overlay .modal');(modal==='details'?panel.querySelector('.x'):method==='manual'?panel.querySelector('#name'):method==='business_card'?panel.querySelector('#cameraChoice'):panel.querySelector('#sourceFile')||panel.querySelector('#name'))?.focus()}
document.addEventListener('keydown',event=>{if(!modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return}if(event.key!=='Tab')return;const focusable=[...document.querySelectorAll('#overlay .modal a[href],#overlay .modal button:not([disabled]),#overlay .modal input:not([disabled]),#overlay .modal textarea:not([disabled])')];if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
function switchMethod(m){collectDraft();method=m;fileData=null;renderModal()}
function openCardSource(source){document.getElementById('source'+source).click()}
function chooseSourceFromInput(input){const file=input.files?.[0];input.value='';chooseSource(file)}
function collectDraft(){if(!modal||modal!=='form')return;['name','company','phone','email','note'].forEach(k=>{draft[k]=$(k).value});draft.role=document.querySelector('input[name="role"]:checked')?.value||'';['projectIds','companyProjectIds'].forEach(k=>draft[k]=[...document.querySelectorAll('input[name="'+k+'"]:checked')].map(x=>x.value))}
function companyKey(s){return (s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function loadCompanyLinks(){const key=companyKey($('company').value);if(key===companyProjectCompanyKey)return;companyProjectCompanyKey=key;companyEdited=false;const linked=data.companies[key],linkedIds=linked?.projectIds||[];draft.companyProjectIds=linkedIds;document.querySelectorAll('input[name="companyProjectIds"]').forEach(box=>{box.checked=linkedIds.includes(box.value);box.disabled=!key});const help=$('companyProjectHelp');if(help)help.textContent=key?'These links are shared across everyone listed under this company and help the CRM connect company contacts and records to its projects. Saving changes here replaces the shared list for all contacts at this company.':'Enter a company above before setting shared company project links.';updateCompanyProjectSummary()}
function updateCompanyProjectSummary(){const summary=$('companyProjectSummary');if(!summary)return;const count=document.querySelectorAll('input[name="companyProjectIds"]:checked').length;summary.textContent=count?'Projects for the whole company · '+count+' selected':'Projects for the whole company (optional)'}

</script>
