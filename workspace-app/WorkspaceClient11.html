<script>
let contactSubmissionKey='',opsNotice='';
let opsState=null,opsFilters={query:'',type:'',project:'',company:'',contact:'',relationship:'',status:'',owner:'',from:'',to:''};
let opsOffset=0,opsRequest=0,opsBusy=false,opsError='',opsSelectedKey='',opsSaveKey='',opsQueryTimer=0;
function newWorkspaceRequestId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():'req-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
function operationKey(record){return record.type+'::'+record.id;}
function formatOpsDate(value){if(!value)return '—';const date=new Date(value);return isNaN(date.getTime())?String(value):date.toLocaleString('en-CA');}
function opsOption(items,current,allLabel){return '<option value="">'+esc(allLabel)+'</option>'+(items||[]).map(item=>'<option value="'+esc(item.value)+'" '+(String(current)===String(item.value)?'selected':'')+'>'+esc(item.label)+'</option>').join('');}
function renderOperations(){if(page!=='operations'||!opsState)return;renderOpsControls();renderOpsMetrics();renderOpsActivity();renderOpsResults();}
function renderOpsControls(){
 const options=opsState.options||{};
 [['type','opsFilterType',options.types,'All types'],['project','opsFilterProject',options.projects,'All projects'],['company','opsFilterCompany',options.companies,'All companies'],['contact','opsFilterContact',options.contacts,'All contacts'],['relationship','opsFilterRelationship',options.relationships,'All relationships'],['status','opsFilterStatus',options.statuses,'All statuses'],['owner','opsFilterOwner',options.owners,'All owners']].forEach(item=>{const node=$(item[1]);if(node)node.innerHTML=opsOption(item[2],opsFilters[item[0]],item[3]);});
 const from=$('opsFilterFrom'),to=$('opsFilterTo');if(from)from.value=opsFilters.from;if(to)to.value=opsFilters.to;
 const search=$('opsSearch');if(search&&search.value!==opsFilters.query)search.value=opsFilters.query;
 const count=Object.keys(opsFilters).filter(key=>Boolean(opsFilters[key])).length;
 const active=$('opsActiveFilters');if(active)active.textContent=count?count+' active filter'+(count===1?'':'s'):'No active filters';
 const clear=$('opsClearFilters');if(clear)clear.disabled=!count;
}
function renderOpsMetrics(){
 const target=$('opsMetrics');if(!target)return;
 const m=opsState.summary||{};
 const cards=[
  ['New submissions',m.newSubmissions||0,'Status is New across the six Hub registers.'],
  ['Open inquiries',m.openInquiries||0,'Excludes closed, declined, cancelled, lost, or resolved work.'],
  ['Open change requests',m.openChanges||0,'Approved work stays open until it is closed.'],
  ['Follow-ups due',m.followUpsDue||0,'Open records with a due date today or earlier.'],
  ['Alerts to review',m.alertIssues||0,'Email alerts marked pending in Activity.']
 ];
 target.innerHTML=cards.map(card=>'<article class="crm-metric"><span>'+esc(card[0])+'</span><strong>'+esc(card[1])+'</strong><small>'+esc(card[2])+'</small></article>').join('');
}
function renderOpsActivity(){
 const target=$('opsActivity');if(!target)return;
 const items=opsState.activity||[];
 target.innerHTML=items.length?'<div class="activity-list">'+items.map(item=>'<article class="activity-item"><div><strong>'+esc(item.type||'Activity')+'</strong><small>'+esc(item.recordId||'')+' · '+esc(formatOpsDate(item.received))+'</small>'+(item.details&&item.details.fileSummary?'<small>'+esc(item.details.fileSummary)+'</small>':'')+(item.error?'<p class="error-inline">'+esc(item.error)+'</p>':'')+'</div><div class="activity-actions"><span class="status-pill '+(item.notification==='Sent'?'good':item.notification==='Received'?'neutral':'warning')+'">'+esc(item.notification||'Recorded')+'</span>'+(item.url?'<a target="_blank" rel="noopener" href="'+esc(item.url)+'">Open record ↗</a>':'')+'</div></article>').join('')+'</div>':'<div class="empty compact-empty">No activity has been recorded yet.</div>';
}
function opsEditForm(record){
 const entries=Object.keys(record.editable||{}).map(key=>{
  const field=record.editable[key],value=field.type==='date'&&field.value?String(field.value).slice(0,10):field.value||'';
  const control=field.type==='textarea'?'<textarea data-op-field="'+esc(key)+'" maxlength="2000">'+esc(value)+'</textarea>':'<input data-op-field="'+esc(key)+'" type="'+esc(field.type||'text')+'" maxlength="2000" value="'+esc(value)+'" '+(key==='status'?'list="opsStatusOptions"':'')+'>';
  return '<label>'+esc(field.label)+control+'</label>';
 }).join('');
 if(!entries)return '';
 const statuses=(opsState.options.statuses||[]).map(item=>'<option value="'+esc(item.value)+'"></option>').join('');
 return '<form class="ops-edit" onsubmit="event.preventDefault();saveOperationUpdate()"><div class="sectionlabel">WORKFLOW FIELDS</div><div class="ops-edit-grid">'+entries+'</div><datalist id="opsStatusOptions">'+statuses+'</datalist><div id="opsFeedback" class="feedback" role="status" aria-live="polite"></div><button id="opsSaveButton" class="primary" type="submit">Save updates</button><p class="muted">Saving updates the working register and emails info@terranode.ca. Original response tabs stay unchanged.</p></form>';
}
function operationDetailHtml(record){
 if(!record)return '';
 const projectLinks=(opsState.projectDirectory||[]).filter(project=>(record.projectIds||[]).includes(project.id));
 const relatedMedia=(opsState.mediaDirectory||[]).filter(media=>(record.projectIds||[]).some(id=>(media.projectIds||[]).includes(id))).slice(0,6);
 const relatedContacts=(record.contactIds||[]).map((id,index)=>({id,name:(record.contactNames||[])[index]||id}));
 const fields=[['Received',formatOpsDate(record.received)],['Person',record.person],['Email',record.email],['Phone',record.phone],['Company',record.company],['Project',record.projectLabel||record.projectText],['Owner',record.owner],['Status',record.status],['Follow-up due',record.followUp?formatOpsDate(record.followUp).split(',')[0]:''],['Next step',record.nextStep],['Decision',record.decision],['Approved amount',record.approvedAmount],['Contact method',record.contactMethod],['Logged by',record.actor],['Summary',record.summary],['Notes',record.notes],['Project type',record.projectType],['Location',record.location],['Budget',record.budget],['Planning stage',record.planningStage],['Needed by',record.neededBy?formatOpsDate(record.neededBy).split(',')[0]:''],['Amount CAD',record.amount],['Visit date',record.visitDate?formatOpsDate(record.visitDate).split(',')[0]:''],['Head office',record.headOffice],['Regions served',record.regions],['Credentials',record.credentials],['Portfolio',record.portfolio],['Typical project size',record.projectSize],['Timing or availability',record.timing]];
 const detailRows=fields.filter(item=>item[1]).map(item=>'<div class="detail-field"><dt>'+esc(item[0])+'</dt><dd>'+esc(item[1])+'</dd></div>').join('');
 const projectHtml=projectLinks.length?projectLinks.map(project=>'<a target="_blank" rel="noopener" href="'+esc(project.url)+'">'+esc(project.name)+' ↗</a>').join(''):(record.projectText?'<span class="muted">No exact project folder match for '+esc(record.projectText)+'.</span>':'<span class="muted">No project linked.</span>');
 const contactHtml=relatedContacts.length?relatedContacts.map(contact=>'<button class="text-button" type="button" data-contact-id="'+esc(contact.id)+'" onclick="filterRelatedContact(this.dataset.contactId)">'+esc(contact.name)+' · View related records</button>').join(''):'<span class="muted">No contact match by exact email, phone, or name.</span>';
 const sourceHtml=record.type==='Contact'?(record.sources&&record.sources.length?record.sources.map(source=>'<a target="_blank" rel="noopener" href="'+esc(source.url||opsState.hubUrl)+'">'+esc(source.kind.replace(/_/g,' '))+' · '+esc(source.filename||source.context||source.created)+' ↗</a>').join(''):'<span class="muted">No original source recorded.</span>'):(record.sourceUrl?'<a target="_blank" rel="noopener" href="'+esc(record.sourceUrl)+'">Open original response ↗</a>':'<span class="muted">The source link is recorded in the Operations Hub.</span>');
 const filesHtml=record.type==='Media batch'&&record.files&&record.files.length?'<div class="detail-links">'+record.files.map(file=>'<a target="_blank" rel="noopener" href="'+esc(file.url)+'">'+esc(file.name)+' · '+esc((file.size/1048576).toFixed(1))+' MB ↗</a>').join('')+'</div>':'';
 const mediaHtml=relatedMedia.length?'<div class="detail-links">'+relatedMedia.map(media=>'<a target="_blank" rel="noopener" href="'+esc(media.recordUrl)+'">'+esc(media.name)+' · '+esc(media.summary)+' ↗</a>').join('')+'</div>':'<span class="muted">No media batch is linked to this project.</span>';
 const activity=(opsState.activity||[]).filter(item=>item.recordId===record.id);
 const activityHtml=activity.length?activity.map(item=>'<span class="status-pill '+(item.notification==='Sent'?'good':item.notification==='Received'?'neutral':'warning')+'">'+esc(item.type)+': '+esc(item.notification||'Recorded')+'</span>').join(' '):'<span class="muted">No notification history for this record.</span>';
 return '<section id="opsDetailPanel" class="operation-detail" aria-labelledby="opsDetailTitle"><div class="operation-detail-head"><div><div class="eyebrow">'+esc(record.type)+'</div><h2 id="opsDetailTitle">'+esc(record.name)+'</h2><p>'+esc(record.id)+'</p></div><button class="small-button" type="button" onclick="closeOperationDetail()">Close details</button></div><dl class="detail-grid">'+detailRows+'</dl><div class="detail-section"><b>Related contacts</b><div class="detail-links">'+contactHtml+'</div></div><div class="detail-section"><b>Project folder</b><div class="detail-links">'+projectHtml+'</div></div><div class="detail-section"><b>Original submission or source history</b><div class="detail-links">'+sourceHtml+'</div></div><div class="detail-section"><b>Related media</b>'+mediaHtml+filesHtml+'</div><div class="detail-section"><b>Email alert history</b><div class="detail-links">'+activityHtml+'</div></div><div class="detail-links"><a target="_blank" rel="noopener" href="'+esc(record.recordUrl)+'">Open secure Hub or Drive record ↗</a></div>'+opsEditForm(record)+'</section>';
}
function renderOpsResults(){
 const target=$('opsResults'),countNode=$('opsResultCount'),status=$('opsStatus');if(!target)return;
 const records=opsState.records||[];
 if(countNode)countNode.textContent=opsState.recordCount+' result'+(opsState.recordCount===1?'':'s')+(opsState.recordCount>records.length?' · showing '+(opsState.offset+1)+'–'+(opsState.offset+records.length):'');
 target.innerHTML=records.length?'<div class="operation-list" role="list">'+records.map(record=>'<button type="button" role="listitem" class="operation-row '+(opsSelectedKey===operationKey(record)?'selected':'')+'" data-record-key="'+esc(operationKey(record))+'" aria-controls="opsDetailPanel" aria-expanded="'+(opsSelectedKey===operationKey(record))+'" onclick="selectOperation(this.dataset.recordKey)"><span class="operation-date">'+esc(formatOpsDate(record.received))+'</span><span class="operation-main"><strong>'+esc(record.name)+'</strong><small>'+esc(record.type)+' · '+esc(record.id)+'</small></span><span class="operation-project">'+esc(record.projectLabel||record.company||record.summary||'No linked project or company')+'</span><span class="operation-status">'+(record.status?'<span class="status-pill neutral">'+esc(record.status)+'</span>':'')+(record.owner?'<small>Owner: '+esc(record.owner)+'</small>':'')+'</span></button>').join(''):'<div class="empty"><strong>'+((opsState.recordCount===0&&!Object.keys(opsFilters).some(key=>opsFilters[key]))?'The registers are ready.':'No matching records.')+'</strong><p>'+((opsState.recordCount===0&&!Object.keys(opsFilters).some(key=>opsFilters[key]))?'New submissions will appear after a linked form or team entry is received.':'Change a filter or search term to see more records.')+'</p></div>';
 const selected=records.find(record=>operationKey(record)===opsSelectedKey);
 const detail=$('opsDetail');if(detail)detail.innerHTML=selected?operationDetailHtml(selected):'';
 const pagination=$('opsPagination');if(pagination)pagination.innerHTML='<button class="small-button" type="button" '+(opsOffset<=0?'disabled':'')+' onclick="moveOpsPage(-1)">Newer records</button><button class="small-button" type="button" '+(!opsState.hasMore?'disabled':'')+' onclick="moveOpsPage(1)">Older records</button>';
 if(status)status.textContent=opsBusy?'Updating results…':'Updated '+formatOpsDate(opsState.updatedAt);
}
function operationsHtml(){
 return '<div class="eyebrow">TERRANODE / OPERATIONS HUB</div><div class="operations-heading"><div><h1>Operations</h1><p>Find the work, people, and submissions connected to each project.</p></div><button class="small-button" type="button" onclick="loadOperations()">Refresh</button></div><div class="operations-toolbar"><div class="search-label">Search all records<input id="opsSearch" class="search" type="search" placeholder="Name, company, email, phone, project, or reference" value="'+esc(opsFilters.query)+'" oninput="setOpsQuery(this.value)"></div><span id="opsActiveFilters" class="muted">No active filters</span><button id="opsClearFilters" class="small-button" type="button" onclick="clearOpsFilters()" disabled>Clear filters</button></div><div class="ops-filter-grid">'+opsFilterMarkup('type','Record type')+opsFilterMarkup('project','Project')+opsFilterMarkup('company','Company')+opsFilterMarkup('contact','Contact')+opsFilterMarkup('relationship','Contact relationship')+opsFilterMarkup('status','Status')+opsFilterMarkup('owner','Owner')+'<label>Received from<input id="opsFilterFrom" type="date" value="'+esc(opsFilters.from)+'" onchange="setOpsFilter(\'from\',this.value)"></label><label>Received to<input id="opsFilterTo" type="date" value="'+esc(opsFilters.to)+'" onchange="setOpsFilter(\'to\',this.value)"></label></div><p class="muted ops-link-note">Contact matches use email or phone; project matches use an exact folder ID or name. Search terms and filters work together.</p><div id="opsNotice" class="notice" role="status" hidden>'+esc(opsNotice)+'</div><div id="opsError" class="error" role="alert" hidden>'+esc(opsError)+'</div><div id="opsMetrics" class="crm-metrics"><div class="empty loading" role="status"><span class="loading-indicator" aria-hidden="true"></span>Loading Operations Hub…</div></div><section class="ops-section"><div class="ops-section-heading"><div><h2>Records</h2><span id="opsResultCount" class="muted">Loading records…</span></div><span id="opsStatus" class="muted" role="status"></span></div><div id="opsDetail"></div><div id="opsResults" aria-busy="true"><div class="empty loading" role="status"><span class="loading-indicator" aria-hidden="true"></span>Loading records…</div></div><div id="opsPagination" class="ops-pagination"></div></section><section class="ops-section"><div class="ops-section-heading"><div><h2>Recent activity</h2><p>Email status and secure source links from the Hub Activity log.</p></div></div><div id="opsActivity"><div class="empty compact-empty">Loading activity…</div></div></section><p class="muted ops-link-note">Record counts use current filters. “New” follows Hub status; open counts exclude terminal outcomes. Pending alert count and recent activity are account-wide.</p>';
}
function opsFilterMarkup(key,label){
 const id={'type':'opsFilterType','project':'opsFilterProject','company':'opsFilterCompany','contact':'opsFilterContact','relationship':'opsFilterRelationship','status':'opsFilterStatus','owner':'opsFilterOwner'}[key];
 const selectId=id||'';
 return '<label>'+esc(label)+'<select id="'+selectId+'" data-ops-filter="'+esc(key)+'" aria-label="'+esc(label)+'" onchange="setOpsFilter(\''+esc(key)+'\',this.value)"><option value="">All '+esc(label.toLowerCase())+'</option></select></label>';
}
function setOpsFilter(key,value){opsFilters[key]=value;opsOffset=0;opsSelectedKey='';loadOperations(true);}
function setOpsQuery(value){opsFilters.query=value;opsOffset=0;opsSelectedKey='';if(opsQueryTimer)clearTimeout(opsQueryTimer);opsQueryTimer=setTimeout(()=>loadOperations(true),300);}
function clearOpsFilters(){Object.keys(opsFilters).forEach(key=>opsFilters[key]='');opsOffset=0;opsSelectedKey='';const search=$('opsSearch');if(search)search.value='';loadOperations(true);}
function moveOpsPage(direction){opsOffset=Math.max(0,opsOffset+direction*75);opsSelectedKey='';loadOperations(true);}
function selectOperation(key){opsSelectedKey=opsSelectedKey===key?'':key;renderOpsResults();const row=Array.from(document.querySelectorAll('[data-record-key]')).find(node=>node.dataset.recordKey===key);if(row)row.focus();}
function closeOperationDetail(){const key=opsSelectedKey;opsSelectedKey='';renderOpsResults();const row=Array.from(document.querySelectorAll('[data-record-key]')).find(node=>node.dataset.recordKey===key);if(row)row.focus();}
function filterRelatedContact(id){opsFilters.contact=id;opsFilters.type='';opsOffset=0;opsSelectedKey='';renderOpsControls();loadOperations(true);}
async function loadOperations(silent){
 const request=++opsRequest;opsBusy=true;opsError='';
 if(!opsState){if(page==='operations')render();}
 else {const status=$('opsStatus'),results=$('opsResults');if(status)status.textContent='Updating results…';if(results)results.setAttribute('aria-busy','true');}
 try{const result=await call('getOperationsState',opsFilters,opsOffset);if(request!==opsRequest)return;opsState=result;opsBusy=false;if(page==='operations'){renderOpsControls();renderOpsMetrics();renderOpsActivity();renderOpsResults();const error=$('opsError');if(error){error.textContent='';error.hidden=true;}const notice=$('opsNotice');if(notice&&opsNotice){notice.textContent=opsNotice;notice.hidden=false;}const results=$('opsResults');if(results)results.setAttribute('aria-busy','false');}}
 catch(error){if(request!==opsRequest)return;opsBusy=false;opsError=error.message||String(error);if(page==='operations'){const target=$('opsError');if(target){target.textContent=opsError;target.hidden=false;}const status=$('opsStatus');if(status)status.textContent='Could not refresh. Your saved records are unchanged.';if(!opsState){const metrics=$('opsMetrics');if(metrics)metrics.innerHTML='<div class="error">Operations data could not load. Check your connection and try Refresh.</div>';}}}
}
async function saveOperationUpdate(){
 const record=(opsState.records||[]).find(item=>operationKey(item)===opsSelectedKey);if(!record)return;
 const feedback=$('opsFeedback'),button=$('opsSaveButton');if(!opsSaveKey)opsSaveKey=newWorkspaceRequestId();
 const updates={};document.querySelectorAll('[data-op-field]').forEach(input=>updates[input.dataset.opField]=input.value);
 if(!Object.keys(updates).length)return;
 button.disabled=true;if(feedback)feedback.textContent='Saving updates…';
 try{const result=await call('updateOperationsRecord',{type:record.type,id:record.id,requestId:opsSaveKey,updates});opsSaveKey='';opsError='';await loadOperations(true);opsNotice='Saved. Email alert '+(result.notification==='Sent'?'sent to info@terranode.ca.':'queued for retry.');const notice=$('opsNotice');if(notice){notice.textContent=opsNotice;notice.hidden=false;}}
 catch(error){if(feedback)feedback.innerHTML='<div class="error">'+esc(error.message||error)+'</div>';if($('opsSaveButton'))$('opsSaveButton').disabled=false;}
}
function renderOpsLoading(){return '<div class="empty loading" role="status"><span class="loading-indicator" aria-hidden="true"></span>Loading Operations Hub…</div>';}
refresh();
</script>
