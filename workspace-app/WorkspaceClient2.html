<script>
function mediaHtml(){return `<div class="eyebrow">TERRANODE / PROJECT MEDIA</div><h1>Upload original photos & videos</h1><p>Choose where this batch belongs, add an optional note, and select the originals from your phone or computer.</p><div class="installcard"><div class="eyebrow">ADD TERRANODE TO YOUR HOME SCREEN</div><strong>Keep the upload shortcut on your phone</strong><div class="installgrid"><div><b>iPhone or iPad</b><br>Open this page in Safari, tap Share, then Add to Home Screen.</div><div><b>Android</b><br>Open this page in Chrome, tap ⋮, then Add to Home screen.</div></div></div><div class="mediaform"><div class="eyebrow">START AN UPLOAD</div><h2>Choose a destination</h2><label>Project or general upload folder<select id="mediaDestination" onchange="mediaDestination=this.value">${destinationOptions(mediaDestination)}</select></label><label>Batch note, optional<input id="batchNote" maxlength="60" placeholder="For example: kitchen site visit or photographer's name"></label><button class="primary" onclick="createBatch()">Create upload folder</button><p class="muted">Choose a project to file the batch directly. Choose General upload when the project is unknown. Files over 45 MB open in Drive’s own uploader to preserve the full original.</p></div>${lastBatch?`<div class="batchresult"><strong>Ready: ${esc(lastBatch.name)}</strong><p>Filed under ${esc(lastBatch.destination)}.</p><a target="_blank" href="${esc(lastBatch.url)}">Open this upload folder in Drive ↗</a><label class="wide">Choose several photos or videos<input id="mediaFiles" type="file" accept="image/${'*'},video/${'*'}" multiple onchange="previewMediaSelection(this.files)"></label><label class="wide">Take a photo or video now<input id="cameraCapture" type="file" accept="image/${'*'},video/${'*'}" capture="environment" onchange="previewMediaSelection(this.files,true)"></label><div id="mediaSelection" class="uploadlist">Choose originals or take a new photo to see filenames, sizes, and file dates here.</div><div class="actions"><button id="uploadMediaButton" class="primary" onclick="uploadMediaFiles()">Upload selected originals</button><button class="small-button" onclick="inspectBatch('${esc(lastBatch.id)}')">Check uploaded files</button></div><div id="uploadFeedback" class="feedback"></div><p class="muted">Original filenames and bytes are kept. Exact retries in this batch are skipped; different files with the same name remain side by side. For larger originals, use the Drive folder link above and choose New → File upload.</p></div>`:''}${lastReport?`<div class="notice"><strong>${esc(lastReport.count)} file${lastReport.count===1?'':'s'} in ${esc(lastReport.destination)}</strong> · ${esc((lastReport.bytes/1048576).toFixed(1))} MB.${lastReport.sameNames.length?` Repeated filenames: ${lastReport.sameNames.map(x=>esc(x.name)).join(', ')}. Drive keeps each file as a separate original.`:' No repeated filenames found in this batch.'}</div>`:''}<div class="choicegrid"><div class="choice"><div class="eyebrow">NEW PROJECT</div><h3>Create its folder</h3><p>Choose the existing category, name the project, then select it as the upload destination above.</p><label class="wide">Category<select id="newCategory"><option value="Residential">Residential</option><option value="Commercial">Commercial</option></select></label><label class="wide">Project name<input id="newProjectName" maxlength="120" placeholder="Street address or project name"></label><button class="small-button" onclick="createProject()">Create project folder</button>${lastProject?`<p><a target="_blank" href="${esc(lastProject.url)}">${esc(lastProject.name)} ↗</a></p>`:''}</div><div class="choice"><div class="eyebrow">EXISTING PROJECTS</div><h3>Browse folders</h3><p>Select a project above to start a batch, or open its Drive folder directly.</p><div class="foldergrid">${data.projects.map(p=>`<a class="folder" target="_blank" href="${esc(p.url)}"><small>${esc(p.group)}</small><strong>${esc(p.name)} ↗</strong></a>`).join('')||'<span class="muted">No project folders yet.</span>'}</div><a target="_blank" href="${esc(data.projectsUrl)}">Open 02 — Projects ↗</a></div></div><div class="intake"><div class="eyebrow">PROJECT UNKNOWN?</div><h2>General upload / unsorted intake</h2><p>Choose “General upload” above when the project is unclear. File the whole batch later when you know its project.</p><a target="_blank" href="${esc(data.intakeUrl)}">Open intake in Drive ↗</a></div><h2>File an intake batch</h2>${data.intakeBatches.length?`<div class="mediaform">${data.intakeBatches.map(b=>`<div class="batchrow"><a target="_blank" href="${esc(b.url)}">${esc(b.name)} ↗</a><select id="target-${esc(b.id)}" aria-label="Project for ${esc(b.name)}"><option value="">Choose project</option>${data.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><button class="small-button" onclick="fileIntake('${esc(b.id)}')">Move batch</button></div>`).join('')}</div>`:'<div class="empty">No unsorted batches waiting.</div>'}<div class="steps"><div><b>1</b><strong>Choose once</strong><p>Select a project, create a new one, or choose General upload.</p></div><div><b>2</b><strong>Upload originals</strong><p>Use this app’s multi-file picker, or the Drive folder link for files over 45 MB.</p></div><div><b>3</b><strong>Check the batch</strong><p>See the file count, total size, repeated filenames, and where the batch was filed.</p></div></div><p class="muted">Each upload batch has its own folder. If you retry the same file in that batch, the app checks its file hash and skips the duplicate. Drive keeps different files with the same filename.</p>`}

</script>
