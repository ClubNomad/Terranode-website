<script>

let data=null,page='contacts',filter='all',query='',modal=null,modalOpener=null,method='manual',draft=null,pending=null,fileData=null,companyEdited=false,companyProjectCompanyKey='',flash='',mediaDestination='intake',lastBatch=null,lastProject=null,lastReport=null,selectedMedia=[],ocrApiPromise=null,ocrWorkerPromise=null,ocrRecognitionQueue=Promise.resolve(),ocrPreviewUrl='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({name:'',company:'',phone:'',email:'',role:'',note:'',projectIds:[],companyProjectIds:[]});
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
async function refresh(){try{data=await call('getState');render();}catch(e){$('app').innerHTML='<div class="error">'+esc(e.message||e)+'</div>';}}
function setPage(next){page=next;['contacts','media','operations'].forEach(name=>{const button=$(name+'Nav');if(!button)return;button.classList.toggle('on',next===name);button.setAttribute('aria-pressed',String(next===name));});render();if(next==='operations')loadOperations();}
function toast(msg){flash=msg;render();setTimeout(()=>{flash='';render()},5000)}
function roles(c){return c.role==='both'?'Client + Vendor':c.role==='vendor'?'Vendor':'Client'}
function render(){if(!data)return; $('app').innerHTML=(flash?'<div class="notice">'+esc(flash)+'</div>':'')+(page==='media'?mediaHtml():page==='operations'?operationsHtml():contactsHtml());if(modal)renderModal();}
function contactsHtml(){let list=data.contacts.filter(c=>(filter==='all'||filter==='duplicates'||(filter==='client'&&c.role!=='vendor')||(filter==='vendor'&&c.role!=='client'))&&[c.name,c.company,c.email,c.phone].join(' ').toLowerCase().includes(query.toLowerCase()));
return '<div class="eyebrow">TERRANODE / RELATIONSHIPS</div><h1>'+({'all':'All contacts','client':'Clients','vendor':'Vendors / Trade Partners','duplicates':'Review duplicates'}[filter])+'</h1><p>One contact can appear in both views. Add a person by hand, from a contact card, or from a business card photo.</p><div class="bar"><div class="tabs">'+[['all','All'],['client','Clients'],['vendor','Vendors'],['duplicates','Review duplicates']].map(([id,label])=>'<button class="'+(filter===id?'on':'')+'" onclick="setFilter(&quot;'+id+'&quot;)">'+label+'</button>').join('')+'</div><button class="primary" onclick="openNew()">+ Add contact</button></div>'+(filter==='duplicates'?duplicatesHtml():'<input class="search" placeholder="Search name, company, email or phone" value="'+esc(query)+'" oninput="query=this.value;renderListOnly()"><div id="contactList">'+listHtml(list)+'</div>')+formsHtml()+'<p class="muted" style="margin-top:20px">Website submissions arrive from the Terranode Operations Hub. <a class="sheet-link" target="_blank" href="'+esc(data.hubUrl)+'">Open response sheet ↗</a></p>';}
function renderListOnly(){const list=data.contacts.filter(c=>(filter==='all'||(filter==='client'&&c.role!=='vendor')||(filter==='vendor'&&c.role!=='client'))&&[c.name,c.company,c.email,c.phone].join(' ').toLowerCase().includes(query.toLowerCase()));$('contactList').innerHTML=listHtml(list)}
function listHtml(list){return list.length?'<div class="cards">'+list.map(c=>'<button class="card" onclick="openDetails(&quot;'+esc(c.id)+'&quot;)"><div class="cardline"><strong>'+esc(c.name)+'</strong><span class="tag '+esc(c.role)+'">'+roles(c)+'</span></div><small>'+esc([c.company,c.email,c.phone].filter(Boolean).join(' · ')||'No additional details')+'</small></button>').join('')+'</div>':'<div class="empty">'+(query?'No contacts match your search. Try a different name, company, email or phone.':'No contacts here yet. Add a contact or share the appropriate form.')+'</div>'}
function duplicatesHtml(){return data.duplicates.length?'<div class="cards">'+data.duplicates.map((p,i)=>'<div class="card"><small>Matching '+esc(p.reason)+'</small><div class="cardline"><strong>'+esc(p.first.name)+' &amp; '+esc(p.second.name)+'</strong></div><div class="actions"><button class="small-button" onclick="mergePair('+i+',true)">Keep '+esc(p.first.name)+'</button><button class="small-button" onclick="mergePair('+i+',false)">Keep '+esc(p.second.name)+'</button></div></div>').join('')+'</div>':'<div class="empty">No possible duplicates by email or phone.</div>'}
function setFilter(v){filter=v;render()}
function formsHtml(){return '<div class="sectionlabel">WAYS TO ADD CONTACTS</div><div class="choicegrid"><div class="choice"><div class="eyebrow">OUR TEAM</div><h3>Add contact details</h3><p>Enter a person, import a vCard, or photograph a business card. Check the details and choose Client, Vendor, or Both.</p><button class="primary" onclick="openNew()">+ Add contact</button></div><div class="choice"><div class="eyebrow">CLIENTS &amp; TRADE PARTNERS</div><h3>Share a form</h3><p>Send the right Terranode form. Replies join the contact list and keep a link to the original submission.</p><a target="_blank" href="'+esc(data.clientFormUrl)+'">Client inquiry form ↗</a><br><br><a target="_blank" href="'+esc(data.vendorFormUrl)+'">Become a trade partner form ↗</a></div></div>'}
function destinationOptions(selected){return '<option value="intake" '+(selected==='intake'?'selected':'')+'>General upload / project unknown</option>'+data.projects.map(p=>'<option value="'+esc(p.id)+'" '+(selected===p.id?'selected':'')+'>'+esc(p.group)+' · '+esc(p.name)+'</option>').join('')}

</script>
